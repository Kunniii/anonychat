services:
  anonychat.products.dev.codechovui.dev:
    build: .
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    ports:
      - 3030:3000
    develop:
      watch:
        # Backend source files: sync and restart container immediately
        - action: sync+restart
          path: ./index.js
          target: /app/index.js
        - action: sync+restart
          path: ./logger.js
          target: /app/logger.js
        - action: sync+restart
          path: ./messageLog.js
          target: /app/messageLog.js
        - action: sync+restart
          path: ./feedbackLog.js
          target: /app/feedbackLog.js
        - action: sync+restart
          path: ./reportLog.js
          target: /app/reportLog.js
        - action: sync+restart
          path: ./sessionStore.js
          target: /app/sessionStore.js
        - action: sync+restart
          path: ./profanity.js
          target: /app/profanity.js
        - action: sync+restart
          path: ./routes
          target: /app/routes
        - action: sync+restart
          path: ./middlewares
          target: /app/middlewares

        # Frontend source files: rebuild image on code changes
        - action: rebuild
          path: ./anonychat-fe
          ignore:
            - anonychat-fe/node_modules/

        # Dependencies and build configuration: trigger full rebuild
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./yarn.lock
        - action: rebuild
          path: ./Dockerfile
